<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" fill="none">
<title>Fig 2 — Provision order</title>
<rect x="0" y="0" width="1600" height="760" fill="#FFFFFF" id="Background"/>
<g id="Header">
<text id="Medium|ls1.6::Kicker" x="64" y="76" font-family="JetBrains Mono" font-size="12" font-weight="400" fill="#667085" letter-spacing="1.6">FIG. 2 · STAND IT UP IN THIS ORDER</text>
<text id="Semi Bold|ls-0.4::Title" x="64" y="116" font-family="Inter" font-size="30" font-weight="700" fill="#101828" letter-spacing="-0.4">App identity first, then the BFF that is allowed to call it</text>
<text id="Regular|ls0::Subtitle" x="64" y="148" font-family="Inter" font-size="17" font-weight="400" fill="#667085">CAN_USE is the last grant, not the first. Confirm the ACL before you ship a header.</text>
</g>
<g id="Step 01">
<rect x="64" y="248" width="288" height="196" rx="16" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1" id="Card"/>
<rect x="64" y="248" width="6" height="196" rx="3" fill="#C4320A" id="Rail"/>
<circle cx="100" cy="284" r="16" fill="#C4320A" id="Num chip"/>
<text id="Bold|ls0::Num" x="100" y="290" font-family="JetBrains Mono" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">01</text>
<text id="Semi Bold|ls0::Title" x="128" y="292" font-family="Inter" font-size="16" font-weight="700" fill="#101828">Databricks App</text>
<g id="Body">
<text id="Regular|ls0::Line 1" x="88" y="328" font-family="Inter" font-size="13.5" font-weight="400" fill="#667085">Deploy the app. Apps injects its own</text>
<text id="Regular|ls0::Line 2" x="88" y="346.9" font-family="Inter" font-size="13.5" font-weight="400" fill="#667085">service principal.</text>
</g>
</g>
<g id="Step 02">
<rect x="370" y="248" width="288" height="196" rx="16" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1" id="Card"/>
<rect x="370" y="248" width="6" height="196" rx="3" fill="#067A5B" id="Rail"/>
<circle cx="406" cy="284" r="16" fill="#067A5B" id="Num chip"/>
<text id="Bold|ls0::Num" x="406" y="290" font-family="JetBrains Mono" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">02</text>
<text id="Semi Bold|ls0::Title" x="434" y="292" font-family="Inter" font-size="16" font-weight="700" fill="#101828">App Postgres role</text>
<g id="Body">
<text id="Regular|ls0::Line 1" x="394" y="328" font-family="Inter" font-size="13.5" font-weight="400" fill="#667085">create-role as</text>
<text id="Regular|ls0::Line 2" x="394" y="346.9" font-family="Inter" font-size="13.5" font-weight="400" fill="#667085">SERVICE_PRINCIPAL. Confirm</text>
<text id="Regular|ls0::Line 3" x="394" y="365.8" font-family="Inter" font-size="13.5" font-weight="400" fill="#667085">bypassrls is false.</text>
</g>
</g>
<g id="Step 03">
<rect x="676" y="248" width="288" height="196" rx="16" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1" id="Card"/>
<rect x="676" y="248" width="6" height="196" rx="3" fill="#0B63CE" id="Rail"/>
<circle cx="712" cy="284" r="16" fill="#0B63CE" id="Num chip"/>
<text id="Bold|ls0::Num" x="712" y="290" font-family="JetBrains Mono" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">03</text>
<text id="Semi Bold|ls0::Title" x="740" y="292" font-family="Inter" font-size="16" font-weight="700" fill="#101828">BFF service principal</text>
<g id="Body">
<text id="Regular|ls0::Line 1" x="700" y="328" font-family="Inter" font-size="13.5" font-weight="400" fill="#667085">Create a second SP. Mint an OAuth</text>
<text id="Regular|ls0::Line 2" x="700" y="346.9" font-family="Inter" font-size="13.5" font-weight="400" fill="#667085">secret. Never reuse the app SP.</text>
</g>
</g>
<g id="Step 04">
<rect x="982" y="248" width="288" height="196" rx="16" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1" id="Card"/>
<rect x="982" y="248" width="6" height="196" rx="3" fill="#C4320A" id="Rail"/>
<circle cx="1018" cy="284" r="16" fill="#C4320A" id="Num chip"/>
<text id="Bold|ls0::Num" x="1018" y="290" font-family="JetBrains Mono" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">04</text>
<text id="Semi Bold|ls0::Title" x="1046" y="292" font-family="Inter" font-size="16" font-weight="700" fill="#101828">Grant CAN_USE</text>
<g id="Body">
<text id="Regular|ls0::Line 1" x="1006" y="328" font-family="Inter" font-size="13.5" font-weight="400" fill="#667085">update-permissions on the app. BFF</text>
<text id="Regular|ls0::Line 2" x="1006" y="346.9" font-family="Inter" font-size="13.5" font-weight="400" fill="#667085">SP plus admins. Nothing else.</text>
</g>
</g>
<g id="Step 05">
<rect x="1288" y="248" width="288" height="196" rx="16" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1" id="Card"/>
<rect x="1288" y="248" width="6" height="196" rx="3" fill="#0B63CE" id="Rail"/>
<circle cx="1324" cy="284" r="16" fill="#0B63CE" id="Num chip"/>
<text id="Bold|ls0::Num" x="1324" y="290" font-family="JetBrains Mono" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">05</text>
<text id="Semi Bold|ls0::Title" x="1352" y="292" font-family="Inter" font-size="16" font-weight="700" fill="#101828">Point the BFF</text>
<g id="Body">
<text id="Regular|ls0::Line 1" x="1312" y="328" font-family="Inter" font-size="13.5" font-weight="400" fill="#667085">DATABRICKS_HOST, APP_URL, SP</text>
<text id="Regular|ls0::Line 2" x="1312" y="346.9" font-family="Inter" font-size="13.5" font-weight="400" fill="#667085">id/secret, SESSION_SECRET.</text>
</g>
</g>
<g id="Check">
<rect x="64" y="476" width="1472" height="176" rx="16" fill="#F9FAFB" stroke="#EAECF0" stroke-width="1" id="Check card"/>
<text id="Medium|ls1.3::BEFORE YOU TRUST THE HEADER" x="88" y="516" font-family="JetBrains Mono" font-size="11" font-weight="400" fill="#667085" letter-spacing="1.3">BEFORE YOU TRUST THE HEADER</text>
<text id="Medium|ls0::databricks apps get-permissions &lt;app-name&gt; --profile &lt;PROFILE&gt;" x="88" y="552" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#101828">databricks apps get-permissions &lt;app-name&gt; --profile &lt;PROFILE&gt;</text>
<g id="Check copy">
<text id="Regular|ls0::Line 1" x="88" y="580" font-family="Inter" font-size="14" font-weight="400" fill="#344054">The list should be: admins CAN_MANAGE, maybe you CAN_MANAGE, and the BFF service principal CAN_USE. If All account users can use the app, the trusted header is no longer trusted.</text>
</g>
</g>
<g id="Caption">
<text id="Medium|ls0.2::Caption" x="48" y="724" font-family="Inter" font-size="13" font-weight="400" fill="#667085" letter-spacing="0.2">Figure 2. Provision order</text>
</g>
</svg>
